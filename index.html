<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0c1c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Soul Drift</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e0c1c;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      /* A phone held upright: ask for landscape. controls.js pauses the run (same media query there). */
      #turn {
        display: none;
      }
      @media (orientation: portrait) and (pointer: coarse) and (max-width: 700px) {
        #turn {
          position: fixed;
          inset: 0;
          z-index: 10;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 28px;
          background: #0e0c1c;
          color: #e6eeea;
          font: italic 600 30px 'Cormorant Garamond', Georgia, serif;
        }
      }
      #turn .phone {
        width: 30px;
        height: 52px;
        border: 2px solid #97aaa2;
        border-radius: 7px;
        animation: turn 2.4s ease-in-out infinite;
      }
      @keyframes turn {
        0%,
        25% {
          transform: rotate(0deg);
        }
        55%,
        100% {
          transform: rotate(-90deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="turn"><div class="phone"></div>Turn your phone sideways</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
